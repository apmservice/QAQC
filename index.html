<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>QA/QC Inspection Checksheet</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
:root{--page-max:1980px;--border:#111;--font:"Times New Roman",Times,serif;--bg:#f5f5f5;--text:#000}
*{box-sizing:border-box}html,body{margin:0;padding:0}body{background:var(--bg);color:var(--text);font-family:var(--font)}
.wrap{min-height:100vh;display:flex;justify-content:center;padding:10px 10px 70px}
.sheet{position:relative;width:min(100%,var(--page-max));background:#fff;border:1px solid var(--border);overflow:hidden}
.fullscreen-fab{position:absolute;top:6px;right:6px;z-index:45;width:36px;height:36px;display:flex;align-items:center;justify-content:center;border:1px solid var(--border);background:#fff;font-size:18px;cursor:pointer;padding:0}
.sheet.is-fs .toolbar,.sheet:fullscreen .toolbar{display:none!important}
.sheet.is-fs,.sheet:fullscreen{width:100vw!important;height:100vh!important;max-width:none!important;border:none!important}
.sheet.is-fs #inspectionBodyScroll,.sheet:fullscreen #inspectionBodyScroll{max-height:none!important}
.toolbar{display:flex;gap:5px;align-items:center;padding:6px 48px 6px 6px;border-top:2px solid var(--border);background:#fafafa;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;white-space:nowrap;position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:60;width:min(100%,var(--page-max));min-height:52px}
.tool-btn{flex:0 0 auto;border:1px solid #888;background:#fff;min-height:40px;padding:6px 12px;font-family:inherit;font-size:14px;cursor:pointer;color:var(--text);white-space:nowrap;border-radius:6px;font-weight:500;-webkit-tap-highlight-color:transparent;user-select:none}
.tool-btn:active{background:#e8e8e8}
.tool-btn.danger{color:#c00;border-color:#c00}
.status-badge{flex:0 0 auto;font-size:11px;color:#0a5a2a;white-space:nowrap;padding:0 4px}
.scroll-x{width:100%;overflow-x:hidden}
table{width:100%;border-collapse:collapse;table-layout:fixed}
td,th{border:1px solid var(--border);padding:0;vertical-align:top;font-size:11px;line-height:1.05;word-break:break-word}
.header td{height:66px}
.logo-cell{width:125px;text-align:center;vertical-align:middle}
.logo-cell img{width:min(110px,90%);max-height:48px;object-fit:contain}
.center-title{text-align:center;vertical-align:middle;font-weight:700}
.center-title .t1,.center-title .t2,.center-title .t3,.appendix,.main-head th{font-size:12px}
.center-title .t2{margin-top:2px}.center-title .t3{margin-top:10px}
.meta{width:238px}.meta td{height:16px;font-size:10px;vertical-align:middle;padding:0 4px}
.meta .label{width:44%}.meta .sep{width:4%;text-align:center;padding:0}.meta .value{width:52%}
.appendix{padding:6px 10px 4px 12px;font-weight:700;text-decoration:underline;font-size:12px}
.main-head th{text-align:center;vertical-align:middle;font-weight:700;padding:1px 2px}
.inspection-shell{display:flex;flex-direction:column;width:100%}
.inspection-header-area{background:#fff;position:relative;z-index:2}
.inspection-head-scroll{width:100%;overflow:hidden;padding-right:var(--sbw,0px);background:#fff}
.inspection-body-scroll{width:100%;overflow:auto;-webkit-overflow-scrolling:touch;background:#fff}
.inspection-body-scroll::-webkit-scrollbar{height:10px;width:10px}
.editable-box{width:100%;min-height:100%;padding:2px 4px;outline:none;border:none;background:transparent;font:inherit;color:inherit;white-space:pre-wrap;overflow-wrap:break-word}
.meta .editable-box{min-height:14px;padding:0 2px}
.footer .editable-box{min-height:17px;padding:1px 2px;text-align:center}
.row td{height:186px}
.media-cell,.remark-cell{padding:2px}
.media-wrap,.remark-wrap{display:flex;flex-direction:column;height:100%;min-height:180px;gap:4px;padding:2px}
.media-toolbar{display:flex;gap:4px;padding:2px 0}
.btn-upload{display:inline-flex;align-items:center;justify-content:center;gap:4px;min-height:34px;padding:4px 8px;border:1px solid #ccc;border-radius:6px;background:#f8f8f8;font-size:13px;cursor:pointer;color:#000;flex:1;font-family:inherit;-webkit-tap-highlight-color:transparent}
.btn-upload input{display:none}
.image-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px;align-content:start;flex:1 1 auto;min-height:0}
.thumb{position:relative;border:1px solid #666;background:#f0f0f0;overflow:hidden;height:90px}
.thumb .thumb-base-img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;z-index:1}
.thumb .thumb-ann-canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block;pointer-events:none;z-index:2}
.thumb-flat-print{display:none;position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;z-index:5;pointer-events:none}
.image-grid.single-thumb,.remark-grid.single-thumb{display:block!important;padding:3px!important;overflow:hidden!important;min-height:0!important}
.field-before.single-thumb,.field-after.single-thumb{flex:1 1 auto;min-height:0!important}
.field-before.single-thumb .thumb,.field-after.single-thumb .thumb{height:100%!important;min-height:0!important;width:100%!important}
.remark-grid.single-thumb{flex:1 1 auto!important;min-height:72px!important}
.remark-grid.single-thumb .thumb{height:100%!important;min-height:72px!important;width:100%!important;flex:none!important}
.image-grid.single-thumb .thumb-base-img,.image-grid.single-thumb .thumb-ann-canvas,.image-grid.single-thumb .thumb-flat-print,.remark-grid.single-thumb .thumb-base-img,.remark-grid.single-thumb .thumb-ann-canvas,.remark-grid.single-thumb .thumb-flat-print{width:100%!important;height:100%!important;object-fit:contain!important}

.thumb-edit-btn{position:absolute;bottom:3px;right:3px;width:28px;height:28px;border:1px solid #555;border-radius:6px;background:rgba(255,255,255,.95);font-size:14px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
.thumb-del-btn{position:absolute;top:3px;right:3px;width:26px;height:26px;border:1px solid #777;border-radius:50%;background:rgba(255,255,255,.95);font-size:15px;cursor:pointer;z-index:10;display:flex;align-items:center;justify-content:center;padding:0;-webkit-tap-highlight-color:transparent}
.remark-grid{flex:1 1 auto;display:flex;flex-direction:row;align-items:stretch;gap:4px;overflow-x:auto;min-height:60px}
.remark-grid .thumb{flex:0 0 120px;width:120px;height:auto!important;min-height:60px}
.remark-text{flex:0 0 auto;min-height:56px;border:1px solid #888;padding:4px;outline:none;white-space:pre-wrap;overflow-wrap:break-word;font-size:11px}
.status-cell{text-align:center;vertical-align:middle}
.status-box{display:flex;align-items:center;justify-content:center;width:100%;height:100%;cursor:pointer}
.status-box input{width:18px;height:18px;margin:0}
.spacer td{height:15px}
.footer td{height:20px;text-align:center;vertical-align:middle;font-size:10px}
.w-no{width:6.2%}.w-name{width:8.1%}.w-problem{width:12.4%}.w-before{width:20%}.w-after{width:20%}.w-pass{width:5.3%}.w-reject{width:5.4%}.w-remark{width:22.6%}
.hdr-hidden{display:none!important}
.ftr-hidden{display:none!important}
/* IMAGE EDITOR */
#edOverlay{display:none;position:fixed;inset:0;z-index:9000;background:rgba(0,0,0,.86);align-items:stretch;justify-content:center;overflow:hidden;padding:0}
#edOverlay.open{display:flex}
#edBox{background:#161616;display:flex;flex-direction:column;width:100vw;height:100vh;max-width:none;max-height:none;overflow:hidden;box-shadow:none;margin:0;color:#fff}
#edToolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;background:#141414;border-bottom:1px solid rgba(255,255,255,.08);overflow-x:auto;overflow-y:hidden;white-space:nowrap;scrollbar-width:thin}
#edToolbar::-webkit-scrollbar{height:8px}
#edToolbar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:10px}
.ed-group{display:flex;align-items:center;gap:8px;flex:0 0 auto}
.ed-group.right{margin-left:auto}
.ed-chip{height:36px;display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:999px;background:#2a2a2a;border:1px solid rgba(255,255,255,.12);color:#fff;font-size:14px;font-weight:700;gap:8px;cursor:default}
.ed-chip .dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.ed-chip.active{background:#303030;border-color:rgba(255,255,255,.18);box-shadow:inset 0 0 0 1px rgba(255,255,255,.05)}
.eb{border:1px solid rgba(255,255,255,.08);background:#252525;border-radius:12px;padding:0 14px;height:44px;font-size:13px;cursor:pointer;font-family:inherit;color:#fff;display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;-webkit-tap-highlight-color:transparent;user-select:none;transition:transform .08s ease,background .15s ease,border-color .15s ease,box-shadow .15s ease;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.eb:active{transform:translateY(1px);background:#1f1f1f}
.eb.act{background:#16a34a;color:#fff;border-color:#22c55e;box-shadow:0 0 0 2px rgba(34,197,94,.22)}
.eb.ok{background:#27ae60;border-color:#31c36f;color:#fff;font-weight:700}
.eb.ng{background:#2a2a2a;border-color:rgba(255,255,255,.08);color:#ff5f57}
.eb.icon{width:56px;min-width:56px;padding:0 6px;font-size:20px;line-height:1;font-weight:700}
.eb.icon.sm{width:46px;min-width:46px;font-size:18px}
.eb.icon span[aria-hidden="true"]{display:inline-block;min-width:1em;text-align:center}
.eb .lbl{font-size:12px;font-weight:700;letter-spacing:.2px}
.ed-sep{width:1px;height:34px;background:rgba(255,255,255,.12);flex-shrink:0;margin:0 2px}
#edStatus{font-size:12px;color:#d1d5db;padding:0 2px;flex:0 0 auto}
#edWrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;background:#1b1b1b;min-height:200px;padding:10px 10px 0}
#edCanvas{display:block;touch-action:none;cursor:crosshair;max-width:min(100%,1200px);border-radius:10px;box-shadow:0 6px 30px rgba(0,0,0,.35);background:#fff}
#edBottomBar{padding:12px 14px 16px;background:#111;border-top:1px solid rgba(255,255,255,.08);display:flex;flex-direction:column;gap:14px}
#edBottomTools{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
#edColors{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.ec{width:42px;height:42px;border-radius:50%;border:3px solid rgba(255,255,255,.18);cursor:pointer;flex-shrink:0;display:inline-block;-webkit-tap-highlight-color:transparent;transition:transform .12s ease,border-color .12s ease,box-shadow .12s ease}
.ec.act{border-color:#fff;transform:scale(1.06);box-shadow:0 0 0 4px rgba(255,255,255,.12)}
#edSizeWrap{display:flex;align-items:center;gap:12px;min-width:min(100%,320px);margin-left:auto}
#edSizeLabel{font-size:13px;color:#d1d5db;white-space:nowrap}
#etFS{appearance:none;-webkit-appearance:none;width:min(48vw,220px);height:10px;border-radius:999px;background:#4b5563;outline:none;cursor:pointer}
#etFS::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:24px;height:24px;border-radius:50%;background:#22c55e;border:none;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#etFS::-moz-range-thumb{width:24px;height:24px;border:none;border-radius:50%;background:#22c55e;box-shadow:0 2px 8px rgba(0,0,0,.3)}
#etFSVal{font-size:13px;color:#fff;min-width:42px;text-align:right}
#edActions{display:flex;gap:12px}
#edActions .eb{height:54px;border-radius:18px;font-size:16px;flex:1}
#edActions .eb .lbl{font-size:16px}
#edTextPop{display:none;position:fixed;z-index:9500;background:#fff;border:2px solid #333;border-radius:12px;padding:12px;box-shadow:0 4px 20px rgba(0,0,0,.35);flex-direction:column;gap:8px;min-width:260px}
#edTextPop.open{display:flex}
#edTF{border:1px solid #ccc;padding:10px 12px;font-size:15px;font-family:inherit;border-radius:8px;outline:none}
#edTextPop .epb{display:flex;gap:8px}
.sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
@media(max-width:760px){
  #edToolbar{padding:10px 10px;gap:8px}
  .eb.icon{width:48px;min-width:48px;height:42px;font-size:18px;border-radius:11px}
  .eb.icon.sm{width:42px;min-width:42px;height:42px;font-size:17px}
  #edWrap{padding:8px 8px 0}
  #edBottomBar{padding:10px 10px 12px;gap:12px}
  #edBottomTools{align-items:flex-start}
  #edSizeWrap{width:100%;min-width:0;justify-content:flex-end}
  #edActions{width:100%}
  #edActions .eb{height:52px}
  .ec{width:40px;height:40px}
}
/* stage สำหรับ PDF */
.spdf-stage{position:fixed!important;left:0!important;top:0!important;width:1320px!important;background:#fff!important;z-index:2147483647!important;opacity:0!important;pointer-events:none!important;overflow:hidden!important}
.spdf-stage .toolbar,.spdf-stage .thumb-edit-btn,.spdf-stage .thumb-del-btn,.spdf-stage .btn-upload,.spdf-stage .media-toolbar,.spdf-stage .fullscreen-fab{display:none!important}
.spdf-stage .inspection-head-scroll,.spdf-stage .inspection-body-scroll{overflow:visible!important;max-height:none!important}
.spdf-stage .inspection-head-scroll{padding-right:0!important;--sbw:0px!important}
.spdf-stage .hdr-hidden{display:block!important}
.spdf-stage .remark-wrap{overflow:visible!important}
.spdf-stage .remark-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important;overflow:visible!important;min-height:0!important;align-content:start!important;align-items:stretch!important}
.spdf-stage .remark-grid .thumb{width:100%!important;min-width:0!important;flex:none!important;height:58px!important;min-height:58px!important}
.spdf-stage .image-grid.single-thumb,.spdf-stage .remark-grid.single-thumb{display:block!important;padding:3px!important;overflow:hidden!important;min-height:0!important}
.spdf-stage .image-grid.single-thumb .thumb,.spdf-stage .remark-grid.single-thumb .thumb{width:100%!important;height:100%!important;min-height:0!important;flex:none!important}
.spdf-stage table.hdr-hidden{display:table!important;width:100%!important}
.spdf-stage .ftr-hidden{display:table!important;width:100%!important}
@media print{
  html,body{margin:0!important;padding:0!important;background:#fff!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{padding:0}.sheet{width:100%;border:1px solid #111}
  .toolbar,.thumb-edit-btn,.thumb-del-btn,.btn-upload,.media-toolbar,.fullscreen-fab{display:none!important}
  .scroll-x{overflow:visible}
  .inspection-head-scroll,.inspection-body-scroll{overflow:visible!important;max-height:none!important}
  .inspection-head-scroll{padding-right:0!important;--sbw:0px!important}
  .hdr-hidden{display:block!important}
  table.hdr-hidden{display:table!important;width:100%!important}
  .remark-wrap{overflow:visible!important}
  .remark-grid{display:grid!important;grid-template-columns:repeat(2,minmax(0,1fr))!important;gap:4px!important;overflow:visible!important;min-height:0!important;align-content:start!important;align-items:stretch!important}
  .remark-grid .thumb{width:100%!important;min-width:0!important;flex:none!important;height:58px!important;min-height:58px!important}
  .image-grid.single-thumb,.remark-grid.single-thumb{display:block!important;padding:3px!important;overflow:hidden!important;min-height:0!important}
  .image-grid.single-thumb .thumb,.remark-grid.single-thumb .thumb{width:100%!important;height:100%!important;min-height:0!important;flex:none!important}
  /* print: ซ่อน base+ann แสดง flat */
  .thumb-base-img,.thumb-ann-canvas{visibility:hidden}
  .thumb-flat-print{display:block!important}
  .row{break-inside:avoid;page-break-inside:avoid}
  @page{size:A4 landscape;margin:0}
}

function edCreateShape(tool,x,y,color){ if(tool==='pencil') return {type:'pencil',points:[{x,y}],color,size:(parseInt(edFSel.value)||18)}; if(tool==='circle') return {type:'circle',x,y,w:0,h:0,color}; if(tool==='rect') return {type:'rect',x,y,w:0,h:0,color}; if(tool==='check') return {type:'check',x,y,w:0,h:0,color}; if(tool==='cross') return {type:'cross',x,y,w:0,h:0,color}; if(tool==='line') return {type:'line',x1:x,y1:y,x2:x,y2:y,color}; return {type:'arrow',x1:x,y1:y,x2:x,y2:y,color}; }
function edShapeTiny(l){ if(!l) return true; if(l.type==='pencil') return !Array.isArray(l.points) || l.points.length<2; if(edIsBoxType(l)) return Math.abs(l.w)<6 && Math.abs(l.h)<6; if(edIsLineType(l)) return Math.hypot(l.x2-l.x1,l.y2-l.y1)<8; return false; }
edCanvas.addEventListener('pointerdown',ev=>{ ev.preventDefault(); const {x,y}=edXY(ev); if(edTool==='select'){ edSel=edHit(x,y); if(edSel){ edDrag=true;edCanvas.setPointerCapture(ev.pointerId); if(edSel.type==='pencil'){edDOX=x;edDOY=y;} else if(edIsBoxType(edSel)){edDOX=x-edSel.x;edDOY=y-edSel.y;} else if(edIsLineType(edSel)){edDOX=x-edSel.x1;edDOY=y-edSel.y1;} else{edDOX=x-edSel.x;edDOY=y-edSel.y;} } edRedraw();return; } if(edTool==='text'||edTool==='number'){ edPendXY={x,y}; const src=ev.touches?ev.touches[0]:ev; edTextPop.style.left=clamp(src.clientX,10,window.innerWidth-260)+'px'; edTextPop.style.top=clamp(src.clientY+14,10,window.innerHeight-120)+'px'; edTF.value=edTool==='number'?String(edNumCnt+1):''; edTextPop.classList.add('open'); setTimeout(()=>edTF.focus(),60); return; } edPushUndo();edDrawing=true;edDS={x,y}; edCanvas.setPointerCapture(ev.pointerId); edLayers.push(edCreateShape(edTool,x,y,edColor)); },{passive:false});
edCanvas.addEventListener('pointermove',ev=>{ ev.preventDefault(); const {x,y}=edXY(ev); if(edDrag&&edSel){ const l=edSel; if(l.type==='pencil'){ const dx=x-edDOX,dy=y-edDOY; l.points=l.points.map(p=>({x:p.x+dx,y:p.y+dy})); edDOX=x;edDOY=y; } else if(edIsBoxType(l)){l.x=x-edDOX;l.y=y-edDOY;} else if(edIsLineType(l)){const nx=x-edDOX,ny=y-edDOY,dx=nx-l.x1,dy=ny-l.y1;l.x1+=dx;l.y1+=dy;l.x2+=dx;l.y2+=dy;} else{l.x=x-edDOX;l.y=y-edDOY;} edRedraw();return; } if(edDrawing&&edLayers.length){ const l=edLayers[edLayers.length-1]; if(l.type==='pencil'){ l.points.push({x,y}); } else if(edIsBoxType(l)){l.w=x-edDS.x;l.h=y-edDS.y;} else if(edIsLineType(l)){l.x2=x;l.y2=y;} edRedraw(); } },{passive:false});
edCanvas.addEventListener('pointerup',ev=>{ ev.preventDefault(); if(edDrag){edDrag=false;schedSave();} if(edDrawing){ edDrawing=false; const l=edLayers[edLayers.length-1]; if(edShapeTiny(l)) edLayers.pop(); edRedraw();schedSave(); } },{passive:false});
edCanvas.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});

function edBuildFlatDataUrl(thumb){ return new Promise(res=>{ const baseUrl=thumb&&thumb._baseUrl||''; if(!baseUrl){res('');return;} const img=new Image(); img.onload=()=>{ const W=img.naturalWidth||edW||800,H=img.naturalHeight||edH||600; const c=document.createElement('canvas'); c.width=W;c.height=H; const ctx=c.getContext('2d'); ctx.drawImage(img,0,0,W,H); (thumb._layers||[]).forEach(l=>drawLayerCtx(ctx,l,1,1,W,H)); try{ res(c.toDataURL('image/jpeg',.92)); }catch(_){ res(baseUrl); } }; img.onerror=()=>res(baseUrl); img.src=baseUrl; }); }
function edRefreshThumb(thumb){ return new Promise(async res=>{ if(!thumb){res();return;} const baseImg=thumb.querySelector('.thumb-base-img'); const doRender=async()=>{ const sw=edW,sh=edH; edW=(baseImg&&baseImg.naturalWidth)||edW||800; edH=(baseImg&&baseImg.naturalHeight)||edH||600; updateThumbAnnotation(thumb); const fi=thumb.querySelector('.thumb-flat-print'); if(fi){ fi.src = await edBuildFlatDataUrl(thumb); } edW=sw;edH=sh; res(); }; if(baseImg && (!baseImg.complete || !baseImg.naturalWidth)){ baseImg.addEventListener('load',()=>{doRender();},{once:true}); baseImg.addEventListener('error',()=>res(),{once:true}); } else { await doRender(); } }); }

function updateThumbAnnotation(thumb){
  let ac=thumb.querySelector('canvas.thumb-ann-canvas');
  if(!ac){
    ac=document.createElement('canvas');
    ac.className='thumb-ann-canvas';
    ac.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2';
    thumb.appendChild(ac);
  }
  const tw=thumb.clientWidth||120,th2=thumb.clientHeight||90;
  ac.width=tw;ac.height=th2;
  const ctx=ac.getContext('2d');
  ctx.clearRect(0,0,tw,th2);
  const sx=tw/edW,sy=th2/edH;
  (thumb._layers||[]).forEach(l=>drawLayerCtx(ctx,l,sx,sy,tw,th2));
}

/* ══ THUMB ══ */
function makeThumb(baseUrl,isRemark,layers){
  const d=document.createElement('div');
  d.className='thumb'+(isRemark?' remark-img':'');
  d._baseUrl=baseUrl;
  d._layers=JSON.parse(JSON.stringify(layers||[]));
  const img=document.createElement('img');
  img.className='thumb-base-img';img.alt='';img.src=baseUrl;img.loading='lazy';
  d.appendChild(img);
  const ac=document.createElement('canvas');
  ac.className='thumb-ann-canvas';
  ac.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:2';
  d.appendChild(ac);
  const fi=document.createElement('img');
  fi.className='thumb-flat-print';fi.alt='';
  d.appendChild(fi);
  const eb=document.createElement('button');
  eb.type='button';eb.className='thumb-edit-btn';eb.title='แก้ไข';eb.textContent='✏️';
  eb.onclick=e=>{e.stopPropagation();openEditor(d);};
  d.appendChild(eb);
  const db=document.createElement('button');
  db.type='button';db.className='thumb-del-btn';db.setAttribute('aria-label','ลบ');db.textContent='×';
  db.onclick=e=>{e.stopPropagation();const g=d.closest('.image-grid');d.remove();syncSingleThumbLayout(g);schedSave();};
  d.appendChild(db);
  if(layers&&layers.length){
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      const tmpImg=new Image();tmpImg.src=baseUrl;
      const doR=()=>{
        const sw=edW,sh=edH;
        edW=tmpImg.naturalWidth||800;edH=tmpImg.naturalHeight||600;
        updateThumbAnnotation(d);
        edW=sw;edH=sh;
      };
      if(tmpImg.complete&&tmpImg.naturalWidth)doR();
      else tmpImg.onload=doR;
    }));
  }
  return d;
}
function getGridData(grid){
  return[...grid.querySelectorAll('.thumb')].map(t=>({base:t._baseUrl||'',layers:t._layers||[]})).filter(t=>t.base);
}
function syncSingleThumbLayout(grid){
  if(!grid)return;
  const count=grid.querySelectorAll('.thumb').length;
  grid.classList.toggle('single-thumb',count===1);
}
function syncRemarkExportLayout(scope=document){
  (scope||document).querySelectorAll('.remark-wrap').forEach(wrap=>{
    const txtEl=wrap.querySelector('.field-remark-text')||wrap.querySelector('.remark-text');
    const grid=wrap.querySelector('.field-remark-images')||wrap.querySelector('.remark-grid');
    const hasText=!!getText(txtEl).trim();
    const imgCount=grid?grid.querySelectorAll('.thumb').length:0;
    wrap.classList.toggle('remark-no-text',!hasText);
    ['remark-imgcount-0','remark-imgcount-1','remark-imgcount-2','remark-imgcount-3','remark-imgcount-4'].forEach(cls=>wrap.classList.remove(cls));
    wrap.classList.add('remark-imgcount-'+Math.min(4,Math.max(0,imgCount)));
  });
}
function clearRemarkExportLayout(scope=document){
  (scope||document).querySelectorAll('.remark-wrap').forEach(wrap=>{
    wrap.classList.remove('remark-no-text','remark-imgcount-0','remark-imgcount-1','remark-imgcount-2','remark-imgcount-3','remark-imgcount-4');

/* ══ ✅ FIX: เพิ่มฟังก์ชัน getRenderedImagesFromGrid ══ */
function getRenderedImagesFromGrid(grid){
  if(!grid) return [];
  return [...grid.querySelectorAll('.thumb')].map(t=>{
    const flat = t.querySelector('.thumb-flat-print');
    const flatSrc = flat&&flat.src&&flat.src!==window.location.href ? flat.src : '';
    return flatSrc || t._baseUrl || '';
  }).filter(Boolean);
}
function getExcelImagesFromGrid(grid){
  if(!grid) return [];
  return [...grid.querySelectorAll('.thumb')].map(t=>{
    const base=t._baseUrl||'';
    if(!base) return null;
    const layers=Array.isArray(t._layers)?t._layers:[];
    let overlay='';
    if(layers.length){
      const baseImg=t.querySelector('.thumb-base-img');
      const ow=Math.max(1,(baseImg&&baseImg.naturalWidth)||1800);
      const oh=Math.max(1,(baseImg&&baseImg.naturalHeight)||1200);
      const cvs=document.createElement('canvas');
      cvs.width=ow;cvs.height=oh;
      const ctx=cvs.getContext('2d');
      ctx.clearRect(0,0,ow,oh);
      layers.forEach(l=>drawLayerCtx(ctx,l,1,1,ow,oh));
      overlay=cvs.toDataURL('image/png');
    }
    return {base,overlay};
  }).filter(Boolean);
}
/* ══ FILE INPUT ══ */
function bindInput(inp){
  inp.onchange=async()=>{
    const grid=document.getElementById(inp.dataset.tgt);if(!grid)return;
    const isRemark=grid.classList.contains('field-remark-images');
    const files=[...inp.files].filter(f=>f.type.startsWith('image/'));
    const avail=Math.max(0,MAX_IMG-grid.querySelectorAll('.thumb').length);
    if(!avail){alert('เต็มแล้ว (สูงสุด '+MAX_IMG+' รูป)');inp.value='';return;}
    const sel=files.slice(0,avail);
    if(files.length>avail)alert('เพิ่มได้อีก '+avail+' รูปเท่านั้น');
    for(const f of sel){
      const ph=document.createElement('div');
      ph.className='thumb';
      ph.style.cssText='display:flex;align-items:center;justify-content:center;font-size:11px;opacity:.5;height:90px';
      ph.textContent='กำลังย่อ…';grid.appendChild(ph);
      try{
        const url=await compressImg(f,1800);
        if(url){const t=makeThumb(url,isRemark,[]);ph.replaceWith(t);syncSingleThumbLayout(grid);}
        else{ph.remove();syncSingleThumbLayout(grid);}
      }catch(e){console.error(e);ph.remove();}
    }
    syncSingleThumbLayout(grid);
    inp.value='';schedSave();
  };
}

function extractRow(row){
  return{
    no:getText(row.querySelector('.row-no')),
    name:getText(row.querySelector('.field-name')),
    problem:getText(row.querySelector('.field-problem')),
    pass:!!row.querySelector('.pass-chk')?.checked,
    reject:!!row.querySelector('.rej-chk')?.checked,
    remarkText:getText(row.querySelector('.field-remark-text')),
    before:getGridData(row.querySelector('.field-before')),
    after:getGridData(row.querySelector('.field-after')),
    remark:getGridData(row.querySelector('.field-remark-images')),
  };

function applyRow(row,data){
  if(!data)return;
  row.querySelector('.field-name').textContent=data.name||'';
  row.querySelector('.field-problem').textContent=data.problem||'';
  row.querySelector('.field-remark-text').textContent=data.remarkText||'';
  row.querySelector('.pass-chk').checked=!!data.pass;
  row.querySelector('.rej-chk').checked=!!data.reject;
  [['field-before',data.before||[],false],['field-after',data.after||[],false],['field-remark-images',data.remark||[],true]].forEach(([cls,items,isR])=>{
    const g=row.querySelector('.'+cls);if(!g)return;
    g.innerHTML='';
    items.slice(0,MAX_IMG).forEach(item=>{
      const base=typeof item==='string'?item:(item.base||item.flat||'');
      const layers=typeof item==='object'?(item.layers||[]):[];
      if(base)g.appendChild(makeThumb(base,isR,layers));
    });
    syncSingleThumbLayout(g);
  });
}

  [...tbody.querySelectorAll('tr.row')].forEach((row,idx)=>{

      const g=inp.closest('.media-wrap,.remark-wrap')?.querySelector('.image-grid');

/* ══ helper: inject flat imgs ══ */
async function injectFlatImgs(thumbs,flatUrls){
  const injected=[];
  thumbs.forEach((thumb,i)=>{
    const url=flatUrls[i];if(!url)return;
    const fi=thumb.querySelector('.thumb-flat-print');
    if(fi){fi.src=url;fi.style.display='block';}
    injected.push({thumb,fi});
  });
  await new Promise(r=>{
    const imgs=injected.map(x=>x.fi).filter(img=>img&&(!img.complete||!img.naturalWidth));
    if(!imgs.length){r();return;}
    let cnt=imgs.length;const done=()=>{if(--cnt<=0)r();};
    imgs.forEach(img=>{img.addEventListener('load',done,{once:true});img.addEventListener('error',done,{once:true});});
    setTimeout(r,3000);
  });
  return injected;
}
function cleanupFlatImgs(injected){
  injected.forEach(({fi})=>{if(fi){fi.src='';fi.style.display='none';}});
}

const DB_NAME = 'qaqc_db';
const DB_VERSION = 1;
const STORE_NAME = 'app_state';
const STATE_KEY = 'qaqc_v7';

function openDB() {
  return new Promise((resolve, reject) => {
    const req = indexedDB.open(DB_NAME, DB_VERSION);

    req.onupgradeneeded = (e) => {
      const db = e.target.result;
      if (!db.objectStoreNames.contains(STORE_NAME)) {
        db.createObjectStore(STORE_NAME);
      }
    };

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(new Error('เปิดฐานข้อมูลไม่ได้'));
  });
}

function idbClearAll() {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const st = tx.objectStore(STORE_NAME);
    const req = st.clear();
    req.onsuccess = () => {};
    req.onerror = () => reject(new Error('ล้างฐานข้อมูลไม่ได้'));
    tx.oncomplete = () => { try{ db.close(); }catch(_e){} resolve(); };
    tx.onerror = () => reject(new Error('ล้างฐานข้อมูลไม่ได้'));
  })).catch(() => Promise.resolve());
}

function idbSet(key, value) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    const store = tx.objectStore(STORE_NAME);
    const req = store.put(value, key);

    req.onsuccess = () => resolve(true);
    req.onerror = () => reject(new Error('บันทึกข้อมูลไม่ได้'));
  }));
}

function idbGet(key) {
  return openDB().then(db => new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const store = tx.objectStore(STORE_NAME);
    const req = store.get(key);

    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(new Error('อ่านข้อมูลไม่ได้'));
  }));
}

document.getElementById('importInput').onchange = function () {
  const f = this.files?.[0];
  if (!f) return;

  if (!f.name.toLowerCase().endsWith('.json')) {
    alert('กรุณาเลือกไฟล์ .json');
    this.value = '';
    return;
  }

  const reader = new FileReader();

  reader.onload = async (e) => {
    try {
      const text = e.target?.result;
      if (typeof text !== 'string') throw new Error('รูปแบบไฟล์ไม่ถูกต้อง');

      const data = JSON.parse(text);

      if (!Array.isArray(data?.rows)) {
        throw new Error('ไม่พบข้อมูล rows');
      }

      if (!data.rows.every(r => typeof r === 'object' && r !== null)) {
        throw new Error('ข้อมูลใน rows ไม่ถูกต้อง');
      }

      if (typeof restoreData !== 'function') {
        throw new Error('ไม่พบฟังก์ชัน restoreData');
      }

      restoreData(data);

      // เปลี่ยนจาก localStorage เป็น IndexedDB
      await idbSet(STATE_KEY, data);

      if (typeof setStatus === 'function') {
        setStatus(`✅ Import ${data.rows.length} แถว สำเร็จ`);
      }

      alert(`Import สำเร็จ ${data.rows.length} แถว`);
    } catch (err) {
      alert('Import ไม่สำเร็จ: ' + (err?.message || 'ข้อมูลไม่ถูกต้อง'));
      if (typeof setStatus === 'function') {
        setStatus('❌ Import ไม่สำเร็จ', false);
      }
    } finally {
      this.value = '';
    }
  };

  reader.onerror = () => {
    alert('อ่านไฟล์ไม่ได้');
    this.value = '';
  };

  reader.readAsText(f, 'UTF-8');
};

  const mediaFiles={},drawingRels=[],anchors=[];let imageCounter=0;
    // 1. เพิ่มฟังก์ชันช่วยแปลงสัดส่วน (0.0 - 1.0) ให้เป็นตำแหน่งพิกัดอ้างอิงจากความกว้าง/ความสูงจริง
  function getColEmu(colInt) {
    const idx = Math.max(0, colInt - 1);
    return Math.round((idx < colPts.length ? colPts[idx] : 15) * 12700);
  }
  function getRowEmu(rowInt) {
    const idx = Math.max(0, rowInt - 1);
    return Math.round((idx < rowHeights.length ? rowHeights[idx] : 15) * 12700);
  }
  function calcAbsCoord(start, end, fraction, emuFn) {
    if (fraction <= 0) return start;
    if (fraction >= 1) return end;
    let total = 0, pos = start;
    while (pos < end) {
      let step = Math.min(Math.floor(pos) + 1, end);
      total += (step - pos) * emuFn(Math.floor(pos));
      pos = step;
    }
    let target = total * fraction;
    pos = start;
    let acc = 0;
    while (pos < end) {
      let step = Math.min(Math.floor(pos) + 1, end);
      let emuHere = (step - pos) * emuFn(Math.floor(pos));
      if (acc + emuHere + 0.001 >= target) {
        return pos + ((target - acc) / emuFn(Math.floor(pos)));
      }
      acc += emuHere;
      pos = step;
    }
    return end;
  }

  // 2. อัปเดต addImageAnchor ให้ใช้ระยะความกว้างจริงแทน 914400
  function addImageAnchor(dataUrl,absStartCol,absStartRow,absEndCol,absEndRow){
    if(!dataUrl)return;
    let parsed;
    try{parsed=dataUrlToBytes(dataUrl);}catch(e){return;}
    imageCounter+=1;
    const ext=guessImageExt(parsed.mime);
    const mediaPath='xl/media/image'+imageCounter+'.'+ext;
    mediaFiles[mediaPath]=parsed.bytes;
    const relId='rId'+imageCounter;
    drawingRels.push({id:relId,target:'../media/image'+imageCounter+'.'+ext});
    const IMG_PAD=9525*4;
    
    const fromColInt=Math.floor(absStartCol),toColInt=Math.floor(absEndCol);
    const fromRowInt=Math.floor(absStartRow),toRowInt=Math.floor(absEndRow);
    
    const fromColOff=Math.round((absStartCol-fromColInt)*getColEmu(fromColInt))+IMG_PAD;
    const fromRowOff=Math.round((absStartRow-fromRowInt)*getRowEmu(fromRowInt))+IMG_PAD;
    const toColOff=Math.round((absEndCol-toColInt)*getColEmu(toColInt))-IMG_PAD;
    const toRowOff=Math.round((absEndRow-toRowInt)*getRowEmu(toRowInt))-IMG_PAD;
    
    anchors.push('<xdr:twoCellAnchor editAs="twoCell">'+
      '<xdr:from><xdr:col>'+(fromColInt-1)+'</xdr:col><xdr:colOff>'+fromColOff+'</xdr:colOff><xdr:row>'+(fromRowInt-1)+'</xdr:row><xdr:rowOff>'+fromRowOff+'</xdr:rowOff></xdr:from>'+
      '<xdr:to><xdr:col>'+(Math.max(fromColInt,toColInt)-1)+'</xdr:col><xdr:colOff>'+toColOff+'</xdr:colOff><xdr:row>'+(Math.max(fromRowInt,toRowInt)-1)+'</xdr:row><xdr:rowOff>'+toRowOff+'</xdr:rowOff></xdr:to>'+
      '<xdr:pic><xdr:nvPicPr><xdr:cNvPr id="'+(1000+imageCounter)+'" name="Picture '+imageCounter+'"/><xdr:cNvPicPr><a:picLocks noChangeAspect="1"/></xdr:cNvPicPr></xdr:nvPicPr>'+
      '<xdr:blipFill><a:blip r:embed="'+relId+'"/><a:stretch><a:fillRect/></a:stretch></xdr:blipFill>'+
      '<xdr:spPr><a:prstGeom prst="rect"><a:avLst/></a:prstGeom><a:ln><a:noFill/></a:ln></xdr:spPr></xdr:pic><xdr:clientData/></xdr:twoCellAnchor>');
  }

  // 3. อัปเดต placeImagesDynamic
  function placeImagesDynamic(images,startCol,endCol,startRow,endRow){
    const imgs=Array.isArray(images)?images.filter(Boolean).slice(0,4):[];
    if(!imgs.length)return;
    const boxes=[];
    if(imgs.length===1){
      boxes.push({x1:0,y1:0,x2:1,y2:1});
    }else if(imgs.length===2){
      boxes.push({x1:0,y1:0,x2:0.5,y2:1});
      boxes.push({x1:0.5,y1:0,x2:1,y2:1});
    }else if(imgs.length===3){
      const w=1/3;
      boxes.push({x1:0,y1:0,x2:w,y2:1});
      boxes.push({x1:w,y1:0,x2:w*2,y2:1});
      boxes.push({x1:w*2,y1:0,x2:1,y2:1});
    }else{
      boxes.push({x1:0,y1:0,x2:0.5,y2:0.5});
      boxes.push({x1:0.5,y1:0,x2:1,y2:0.5});
      boxes.push({x1:0,y1:0.5,x2:0.5,y2:1});
      boxes.push({x1:0.5,y1:0.5,x2:1,y2:1});
    }
    imgs.forEach((item,i)=>{
      const b=boxes[i];
      // แปลงสัดส่วน 0-1 เป็นพิกัดจริง
      const x1=calcAbsCoord(startCol, endCol, b.x1, getColEmu);
      const y1=calcAbsCoord(startRow, endRow, b.y1, getRowEmu);
      const x2=calcAbsCoord(startCol, endCol, b.x2, getColEmu);
      const y2=calcAbsCoord(startRow, endRow, b.y2, getRowEmu);
      
      const baseSrc=item&&typeof item==='object'?(item.base||''):item;
      const overlaySrc=item&&typeof item==='object'?(item.overlay||''):'';
      if(baseSrc) addImageAnchor(baseSrc,x1,y1,x2,y2);
      if(overlaySrc) addImageAnchor(overlaySrc,x1,y1,x2,y2);
    });
  }

    const rowEl=rowsEls[idx];
    if(!rowEl)return r;
    return{
      ...r,
      before:getExcelImagesFromGrid(rowEl.querySelector('.field-before')),
      after:getExcelImagesFromGrid(rowEl.querySelector('.field-after')),
      remarkImages:getExcelImagesFromGrid(rowEl.querySelector('.field-remark-images'))
    };
  });
  return payload;
}

const excelBtn=document.getElementById('excelBtn');
excelBtn.onclick=async()=>{
  try{
    setStatus('⏳ กำลัง Export Excel…');
    const payload=collectExcelPayload();
    const fileMap=buildXlsxFileMap(payload);
    const blob=zipStore(fileMap);

    const now=new Date();
    const pad=n=>String(n).padStart(2,'0');
    const fileName=
      'QAQC_' +
      now.getFullYear() +
      pad(now.getMonth()+1) +
      pad(now.getDate()) + '_' +
      pad(now.getHours()) +
      pad(now.getMinutes()) +
      '.xlsx';

    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=fileName;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    setStatus('✅ Export Excel สำเร็จ');
  }catch(err){
    console.error(err);
    alert('Export Excel ไม่สำเร็จ: '+err.message);
    setStatus('❌ Export Excel ไม่สำเร็จ',false);
  }
};

})();
</script>
